<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculadora</title>
  <style>
    :root {
      --fundo: #05070d;
      --painel: #0b1120;
      --tecla: #141c33;
      --tecla-hover: #1d2848;
      --azul: #2f6bff;
      --azul-claro: #6b9bff;
      --texto: #e8eeff;
    }
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; margin: 0; background: var(--fundo); color: var(--texto); }
    .calc { background: var(--painel); padding: 18px; border-radius: 20px; width: 300px; border: 1px solid #1a2547; box-shadow: 0 0 40px rgba(47,107,255,.25); }
    #display { width: 100%; font-size: 30px; text-align: right; padding: 14px; border: 1px solid #1f2d5c; border-radius: 10px; background: #000; color: var(--azul-claro); outline: none; }
    #status { min-height: 18px; font-size: 13px; color: #ff6b81; margin: 6px 2px 10px; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    button { font-size: 20px; padding: 14px 0; border: none; border-radius: 10px; background: var(--tecla); color: var(--texto); cursor: pointer; transition: background .15s; }
    button:hover { background: var(--tecla-hover); }
    .op { background: #0f2a66; color: var(--azul-claro); }
    .op:hover { background: #163a8a; }
    .eq { background: var(--azul); color: #fff; }
    .eq:hover { background: #4a7fff; }
  </style>
</head>
<body>
  <div class="calc">
    <input id="display" readonly value="">
    <div id="status"></div>
    <div class="grid" id="teclas"></div>
  </div>

  <script>
    const display = document.getElementById("display");
    const status = document.getElementById("status");
    const grid = document.getElementById("teclas");
    const teclas = ["7","8","9","/","4","5","6","*","1","2","3","-","0",".","C","+","(",")","**","="];
    const operadores = ["/", "*", "-", "+", "**"];

    teclas.forEach(t => {
      const b = document.createElement("button");
      b.textContent = t;
      if (operadores.includes(t)) b.className = "op";
      if (t === "=") b.className = "eq";
      b.onclick = () => pressionar(t);
      grid.appendChild(b);
    });

    function pressionar(t) {
      status.textContent = "";
      if (t === "C") { display.value = ""; return; }
      if (t === "=") return calcular();
      display.value += t;
    }

    async function calcular() {
      if (!display.value) return;

      if (location.protocol === "file:") {
        status.textContent = "Abra pelo servidor: rode 'python app.py' e acesse http://127.0.0.1:5000";
        return;
      }

      try {
        const resp = await fetch("/calcular", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ expressao: display.value })
        });
        const dados = await resp.json();
        if (resp.ok) {
          display.value = dados.resultado;
        } else {
          status.textContent = dados.erro || "Erro no cálculo";
        }
      } catch {
        status.textContent = "Não consegui falar com o servidor. O 'python app.py' está rodando?";
      }
    }

    document.addEventListener("keydown", e => {
      status.textContent = "";
      if (e.key === "Enter") calcular();
      else if (e.key === "Backspace") display.value = display.value.slice(0, -1);
      else if (e.key === "Escape") display.value = "";
      else if ("0123456789+-*/.()".includes(e.key)) display.value += e.key;
    });
  </script>
</body>
</html>
